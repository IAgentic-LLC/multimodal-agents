services:
  studio-postgres:
    image: postgres:17-alpine
    container_name: multimodal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: multimodal
      POSTGRES_USER: studio_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?required}
      STUDIO_APP_PASSWORD: ${STUDIO_APP_PASSWORD:?required}
    volumes:
      - studio-postgres-data:/var/lib/postgresql/data
      - ../postgres/init.sh:/docker-entrypoint-initdb.d/10-studio.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_admin -d multimodal"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [studio-private]

  studio-api:
    build:
      context: ../..
      dockerfile: deploy/api/Dockerfile
    image: iagentic-multimodal-api:local
    container_name: multimodal-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://studio_app:${STUDIO_APP_PASSWORD:?required}@studio-postgres:5432/multimodal
      AUTH_MODE: ${AUTH_MODE:-auth0}
      ALLOW_INSECURE_LOCAL_TENANT: ${ALLOW_INSECURE_LOCAL_TENANT:-false}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
    depends_on:
      studio-postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks: [studio-private, studio-egress]

  multimodal-studio:
    build:
      context: ../../frontend
    image: iagentic-multimodal-studio:local
    container_name: multimodal-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /var/cache/nginx:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      studio-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [studio-private, studio-edge]

volumes:
  studio-postgres-data:

networks:
  studio-private:
    internal: true
  studio-edge:
  studio-egress:
