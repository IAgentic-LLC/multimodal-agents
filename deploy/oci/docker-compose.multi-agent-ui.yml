services:
  orchestration-studio:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.orchestration
    image: iagentic-multimodal-orchestration-studio:local
    container_name: multimodal-orchestration-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /var/cache/nginx:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [orchestration-edge]

networks:
  orchestration-edge:
    name: multimodal-orchestration-edge
    external: true
