<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gate 4 grounding result</title>
    <style>
      * { box-sizing: border-box; }
      body {
        width: 900px;
        margin: 0;
        padding: 36px;
        color: #17213b;
        background: #f7f8fc;
        font-family: Inter, system-ui, sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 30px; }
      .subtitle { margin: 0 0 24px; color: #526079; font-size: 17px; }
      .content { display: grid; grid-template-columns: 640px 1fr; gap: 24px; }
      .image { position: relative; width: 640px; height: 480px; }
      img { display: block; width: 640px; height: 480px; }
      .box { position: absolute; left: 80px; top: 120px; width: 160px; height: 240px; }
      .truth { border: 5px solid #2f9e44; }
      .model { border: 3px dashed #f08c00; outline: 2px solid #fff; }
      .results { display: grid; align-content: start; gap: 16px; }
      .result { padding: 16px; border-left: 5px solid #2f9e44; background: #fff; }
      .result.absent { border-color: #5b7cfa; }
      strong, span { display: block; }
      span { margin-top: 5px; color: #526079; line-height: 1.35; }
      .legend { display: flex; gap: 20px; margin-top: 18px; font-size: 14px; }
      .green { color: #2f9e44; }
      .orange { color: #d97706; }
    </style>
  </head>
  <body>
    <h1>Ground the claim, or leave it unresolved</h1>
    <p class="subtitle">One known object and one planted absence</p>
    <div class="content">
      <div>
        <div class="image">
          <img src="shapes.png" alt="Red rectangle and blue circle on white" />
          <div class="box truth" aria-label="Ground-truth region"></div>
          <div class="box model" aria-label="Model region"></div>
        </div>
        <div class="legend">
          <strong class="green">Solid: ground truth</strong>
          <strong class="orange">Dashed: model</strong>
        </div>
      </div>
      <div class="results">
        <div class="result">
          <strong>red rectangle</strong>
          <span>resolved · IoU 1.0 · confidence 1.0</span>
        </div>
        <div class="result absent">
          <strong>green triangle</strong>
          <span>absent · resolved false · no box</span>
        </div>
      </div>
    </div>
  </body>
</html>
