<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grounding fixture</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #d9dee8; }
      #fixture {
        position: relative;
        width: 640px;
        height: 480px;
        overflow: hidden;
        background: #fff;
      }
      #red-rectangle {
        position: absolute;
        left: 80px;
        top: 120px;
        width: 160px;
        height: 240px;
        background: #d92d20;
      }
      #blue-circle {
        position: absolute;
        left: 390px;
        top: 150px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: #175cd3;
      }
    </style>
  <style>
    /* Flat editorial treatment for reproducible book figures. */
    body { background: #f4f2eb !important; color: #1f2933 !important;
      font-family: Arial, Helvetica, sans-serif !important; }
    .card, .summary, article, figure, section, .panel, .result, .metric {
      border-radius: 0 !important; box-shadow: none !important;
      backdrop-filter: none !important; }
    .card, article, figure, .panel, .result, .metric {
      border-color: #9aa3ab !important; }
    .summary, .card, .answer, .result { background: #fff !important;
      color: #1f2933 !important; border: 1px solid #495057 !important; }
    .summary strong, .card strong, .answer strong, .result strong {
      color: #006b4f !important; }
    .badge { border-radius: 2px !important; }
    button { border-radius: 2px !important; box-shadow: none !important; }
  </style>
</head>
  <body>
    <main id="fixture" aria-label="Grounding fixture">
      <div id="red-rectangle" aria-label="red rectangle"></div>
      <div id="blue-circle" aria-label="blue circle"></div>
    </main>
  </body>
</html>
