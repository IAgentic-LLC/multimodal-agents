server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # A real NIfTI/DICOM volume upload can be up to ~200MB; nginx's 1MB
  # default would reject it with 413 before it ever reaches the coordinator.
  client_max_body_size 250m;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://orchestration-coordinator:8000/api/;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Host $host;
    # Otherwise nginx buffers the whole request body to disk before
    # forwarding it, and this container's /var/cache/nginx tmpfs is only
    # 16m: a real 200MB volume upload would fail here, not at the
    # coordinator, which already has real room for it.
    proxy_request_buffering off;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(self)" always;
  # worker-src falls back to script-src when unset, which blocks the
  # blob: workers both Niivue and itk-wasm create for real rendering work
  # off the main thread; this was already silently broken for Niivue
  # before this change, not something the new volume pipeline introduced.
  # frame-src falls back to default-src when unset, which blocks the
  # hidden iframe auth0-react uses for its silent-auth session check
  # (getAccessTokenSilently / checkSession on page load).
  # connect-src needs data: too: @thewtex/zstddec's own decoder wasm is
  # small enough that Vite's production build inlines it as a
  # data:application/octet-stream URI, and the worker fetches that URI
  # the same way it would fetch any other same-origin file (verified by
  # grepping the real built bundle and reproducing the exact "Failed to
  # fetch" TypeError from inside the itk-wasm worker without this).
  # script-src needs unsafe-eval, not just wasm-unsafe-eval: confirmed by
  # direct test (a plain WebAssembly.instantiate(), on the main thread
  # and inside a real Worker, both succeeded under wasm-unsafe-eval
  # alone) that the real failure is itk-wasm's Emscripten-generated embind
  # glue code, which calls new Function() to register bindings; that is
  # plain JS eval, and wasm-unsafe-eval is deliberately scoped to wasm
  # bytecode compilation only, not JS-level code generation. The real fix
  # upstream is rebuilding with -sDYNAMIC_EXECUTION=0 -sEMBIND_AOT (not
  # something this book controls for itk-wasm's prebuilt pipelines), so
  # unsafe-eval here is a real, documented, known tradeoff the author
  # explicitly accepted, not a guess or a silent weakening.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; frame-src https://dev-a73uyb0st1rx7y8q.eu.auth0.com; connect-src 'self' data: https://dev-a73uyb0st1rx7y8q.eu.auth0.com" always;
}
