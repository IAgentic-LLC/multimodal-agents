server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://studio-api:8000/;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Host $host;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(self), microphone=(self)" always;
  # worker-src falls back to script-src when unset, which blocks the
  # blob: workers both Niivue and itk-wasm create for real rendering work.
  # connect-src needs data: too: @thewtex/zstddec's decoder wasm is small
  # enough that Vite's production build inlines it as a
  # data:application/octet-stream URI, which the worker then fetches.
  # script-src needs unsafe-eval, not just wasm-unsafe-eval: itk-wasm's
  # Emscripten-generated embind glue code calls new Function() to
  # register bindings, which is plain JS eval, not wasm compilation
  # (verified directly: WebAssembly.instantiate() alone works fine under
  # wasm-unsafe-eval). A real, documented, known tradeoff, not a guess.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' data:" always;
}
