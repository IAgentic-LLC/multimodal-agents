[project]
name = "multimodal-agents"
version = "0.1.0"
description = "Evidence-first multimodal agent experiments"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.119.1",
    "opentelemetry-sdk==1.38.0",
    "pillow==12.3.0",
    "psycopg[binary]==3.2.12",
    "pyjwt[crypto]==2.15.0",
    "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
gemini = ["google-genai==2.25.0"]

[project.scripts]
multimodal-capture = "multimodal_agents.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_agents"]

[tool.hatch.build.targets.wheel.force-include]
"src/multimodal_agents/web" = "multimodal_agents/web"

[tool.ruff]
line-length = 78

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "oci>=2.187.0",
    "pytest==8.4.2",
]
