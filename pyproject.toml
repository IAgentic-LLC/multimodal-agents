[project]
name = "multimodal-agents"
version = "0.1.0"
description = "Evidence-first multimodal agent experiments"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==1.1.2",
    "fastapi==0.119.1",
    "google-genai==2.25.0",
    "lap>=0.5.12",
    "langfuse>=4.0,<5",
    "mcp>=2.2.0",
    "nibabel>=5.4.2",
    "ome-zarr>=0.19.2",
    "openai>=3.23.0",
    "opentelemetry-sdk==1.38.0",
    "pi-heif>=1.4.0",
    "pillow==12.3.0",
    "pooch>=1.9.0",
    "psycopg[binary]==3.2.12",
    "pydicom>=3.0.2",
    "pyjwt[crypto]==2.15.0",
    "python-multipart==0.0.20",
    "scikit-image>=0.26.0",
    "ultralytics>=8.4.171",
    "uvicorn[standard]==0.38.0",
    "zarr>=3.4.0",
]

[project.scripts]
multimodal-capture = "multimodal_agents.server:main"
studio-mcp-server = "multimodal_agents.studio_mcp_server:main"
studio-cli = "multimodal_agents.studio_cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_agents"]

[tool.hatch.build.targets.wheel.force-include]
"src/multimodal_agents/web" = "multimodal_agents/web"

[tool.ruff]
line-length = 78

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "oci>=2.187.0",
    "pytest==8.4.2",
    "ruff>=0.16.9",
]
